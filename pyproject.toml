# Tool configuration only (the project is not packaged). Owner: B17 quality pyramid (Bible PHASE 31/32).
[tool.pytest.ini_options]
testpaths = ["tests"]                  # bare `pytest` must not collect scripts/test_inventory.py
pythonpath = ["."]                     # tests import `engine`; works without `python -m pytest`
markers = [
    "integration: multi-module synthetic end-to-end runs (pyramid level 2)",
]

[tool.quality_gate]
# Thresholds for scripts/quality_gate.py; each has its documented reason in DEFAULTS there.
giant_warn = 120
giant_error = 300
test_seconds = 90.0

[tool.mypy]
# S17a (contract C62 section 61: type safety); F21 (C75 phase 17) extended the scope to engine/research. The older engine is untyped by design.
# Default mode checks every ANNOTATED function; wiring.py (the integration seam) is held to full strictness below.
python_version = "3.11"
files = ["engine/learning", "engine/research", "creator/model.py", "creator/ledger.py", "creator/build.py", "creator/testrun.py", "creator/sandbox.py", "creator/selfmodel.py", "creator/devbench.py", "creator/evaluate.py", "creator/agents.py", "creator/objective.py", "creator/gaps.py", "creator/audit", "creator/efficiency.py", "creator/planner.py", "creator/kernel.py", "creator/generator.py", "creator/autotune.py", "creator/localworker.py", "creator/selfworkers.py", "creator/swarm.py", "creator/oversight.py", "creator/recursion.py", "creator/reproduce.py", "creator/claims.py", "creator/replay_student.py", "creator/testgen.py", "creator/recon.py", "creator/synth.py", "creator/student.py", "creator/curriculum.py", "creator/model_student.py", "creator/action_student.py", "creator/lm", "creator/goals.py"]
ignore_missing_imports = true          # pandas/scipy/sklearn/lightgbm ship no complete stubs; third-party gaps are not our errors
follow_imports = "silent"              # errors in engine/*.py (outside the package) are reported by their own owners, not here
disable_error_code = ["annotation-unchecked"]
warn_unused_configs = true
show_error_codes = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["engine.learning.wiring"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_return_any = true
no_implicit_reexport = true
