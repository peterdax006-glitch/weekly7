# Tool configuration only (the project is not packaged). Owner: B17 quality pyramid (Bible PHASE 31/32).
[tool.pytest.ini_options]
testpaths = ["tests"]                  # bare `pytest` must not collect scripts/test_inventory.py
pythonpath = ["."]                     # tests import `engine`; works without `python -m pytest`
markers = [
    "integration: multi-module synthetic end-to-end runs (pyramid level 2)",
]

[tool.quality_gate]
# Thresholds for scripts/quality_gate.py; each has its documented reason in DEFAULTS there.
giant_warn = 120
giant_error = 300
test_seconds = 90.0

[tool.mypy]
# S17a (contract C62 section 61: type safety). Scope is the learning package only; the older engine is untyped by design.
# Default mode checks every ANNOTATED function; wiring.py (the integration seam) is held to full strictness below.
python_version = "3.11"
files = ["engine/learning"]
ignore_missing_imports = true          # pandas/scipy/sklearn/lightgbm ship no complete stubs; third-party gaps are not our errors
follow_imports = "silent"              # errors in engine/*.py (outside the package) are reported by their own owners, not here
disable_error_code = ["annotation-unchecked"]
warn_unused_configs = true
show_error_codes = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["engine.learning.wiring"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_return_any = true
no_implicit_reexport = true

[[tool.mypy.overrides]]
# PENDING, not clean: these two files are still being written by the learner-loop builder (uncommitted edits at S17a time).
# Their errors (learner.py 59, same_year.py 20 at 2026-09-29) are listed by `python -m mypy --config-file /dev/null`-style runs with this
# block removed. S17b must delete this block and fix them; do not add other modules here.
module = ["engine.learning.learner", "engine.learning.same_year", "engine.learning.contradiction_monitor", "engine.learning.test_path"]
ignore_errors = true
